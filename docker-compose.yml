services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - server/.env.production
    volumes:
      - server_data:/app/server/data
    networks:
      - kiber_net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - kiber_net

volumes:
  server_data:

networks:
  kiber_net:
    driver: bridge
